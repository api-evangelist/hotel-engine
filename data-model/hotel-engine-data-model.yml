flow:
  - stage: Find Properties
    operation: ContentService_ListProperties
    produces: Property
  - stage: Shop Rates
    operation: LodgingShoppingService_FindBestOffers
    produces: BestOffer (+ continuation_token)
  - stage: Shop Rates
    operation: LodgingShoppingService_FindAvailability
    consumes: property_id or continuation_token
    produces: RoomGroup -> Offer
  - stage: Transact
    operation: LodgingBookingService_ConfirmOffer
    consumes: continuation_token
    produces: Quote (price locked, limited window)
  - stage: Transact
    operation: LodgingBookingService_Book
    consumes: continuation_token + PaymentInfo + guests
    produces: BookingDetails
  - stage: Manage
    operations: [LodgingBookingService_GetBookings, LodgingBookingService_GenerateFolio, LodgingBookingService_PreviewCancellation, LodgingBookingService_SubmitCancellation]
    consumes: booking_id
