summary: >-
  The Omni domain model is a linear pipeline rather than a CRUD graph: Property (static content)
  feeds a shop, the shop yields RoomGroups of Offers, an Offer is locked into a Quote, and a
  Quote becomes a BookingDetails. Only two entities carry stable public identifiers — Property
  (property_id, "P" + 19 digits) and BookingDetails (booking_id). Everything between them is
  carried by an opaque continuation_token rather than an addressable id, which is why there are
  no GET-by-id endpoints for offers or quotes.
identifiers:
  - entity: Property
    field: property_id
    format: 'P + 19 digits (observed: P0000000000000108984)'
    stable: true
  - entity: BookingDetails
    field: booking_id
    format: opaque string
    stable: true
  - entity: Offer / Quote
    field: continuation_token
    format: opaque, versioned string (observed prefix "v0_")
    stable: false
    note: >-
      Single-use and time-boxed. Carries shop criteria and the locked price forward from
      FindBestOffers to FindAvailability to ConfirmOffer to Book. Not an addressable id.
entities:
  - name: Property
    schema: lodgingProperty
    lifecycle: stable
    description: Static lodging content — name, physical address, coordinates, images, description, amenities, star rating, check-in/out times, loyalty program.
  - name: ResponsiveProperty
    schema: shoplodgingservicev1ResponsiveProperty / enginecontentservicev1ResponsiveProperty
    description: A Property plus its Distance from the search point.
  - name: PropertyCatalogEntry
    schema: v1PropertyCatalogEntry
    description: A Property plus its catalog state, used for full-catalog synchronization.
  - name: BestOffer
    schema: v1BestOffer
    lifecycle: volatile
    description: The lowest-priced OfferSummary for one property plus availability flags (refundable, loyalty, free breakfast) and a continuation_token.
  - name: RoomGroup
    schema: v1RoomGroup
    description: One room type — a RoomDescription plus the Offers available for it with differing amenities and conditions.
  - name: Offer
    schema: v1Offer
    lifecycle: volatile
    description: A purchasable rate for a room type, wrapping an OfferSummary.
  - name: OfferSummary
    schema: v1OfferSummary
    description: The priced core of an offer — property_id, price, offer amenities, cancellation conditions, rate data, sell type.
  - name: Quote
    schema: v1Quote
    lifecycle: confirmed
    description: A price locked for a limited window by ConfirmOffer, carrying the offer summary, room description, and available actions.
  - name: BookingDetails
    schema: v1BookingDetails
    lifecycle: confirmed
    description: A confirmed reservation — booking_id, status, reservation details, cancellation details, metadata, and per-room guests.
  - name: ReservationDetails
    schema: v1ReservationDetails
    description: The realized quote, the property it was booked at, and the payment actually applied.
  - name: RoomGuests
    schema: v1RoomGuests
    description: The primary guest (with loyalty identifier) and additional guests for one room.
  - name: Price
    schema: v1Price
    description: Base, subtotal, taxes_and_fees, total, strike, due-now/due-later, and line items in a CurrencyValue.
  - name: PaymentInfo
    schema: v1PaymentInfo
    description: Either Engine DirectBill or a PaymentCard (with billing address).
