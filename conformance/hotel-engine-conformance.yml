summary: >-
  The Omni Partner API is a protobuf-first gRPC API with a generated HTTP/JSON projection. It
  conforms to the Google API design idiom (proto3, google.rpc.Status errors, AIP-158 page
  tokens, google.api.http annotations) and to Semantic Versioning, but it does not implement
  the web-API standards families — no OAuth2/OIDC, no RFC 9457 problem details, no JSON:API,
  no RFC 8594 Sunset headers, no OpenAPI 3.x (the published contract is Swagger 2.0).
standards:
  - id: proto3
    conforms: true
    evidence: All 48 harvested .proto files declare syntax = "proto3".
  - id: grpc
    conforms: true
    evidence: Four gRPC services published at partner-api.engine.com:443 with pre-compiled JVM bindings on Maven Central.
  - id: swagger-2.0
    conforms: true
    evidence: 'Published contract declares swagger: "2.0" with 11 operations and 118 definitions.'
  - id: openapi-3.x
    conforms: false
    evidence: >-
      The published document is Swagger 2.0, generated by grpc-gateway protoc-gen-openapiv2.
      Engine separately maintains engine-public/protoc-gen-openapi, which emits OpenAPI 3.1,
      but the Partner API release artifacts are not yet produced with it.
  - id: google-aip
    conforms: true
    evidence: >-
      google.api.http annotations for HTTP/JSON transcoding; page_size/page_token/next_page_token
      pagination (AIP-158); google.rpc.Status error envelope with typed details.
  - id: grpc-status-errors
