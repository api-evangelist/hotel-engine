    metric: requests_per_minute
    limit: 50
    timeFrame: minute
  - name: LodgingShoppingService.FindBestOffers / FindBestOffersStreaming (sustained)
    scope: endpoint
    metric: requests_per_hour
    limit: 2250
    timeFrame: hour
  - name: LodgingShoppingService.FindAvailability (burst)
