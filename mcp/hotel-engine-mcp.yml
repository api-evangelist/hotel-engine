authentication_constraint: >-
  A hosted MCP server for Omni would have to bridge mutual TLS. The Partner API accepts only
  client-certificate authentication, so an MCP server cannot pass a bearer token through to the
  origin — it must hold the partner certificate itself and enforce tenancy above it. This is the
  main design obstacle, and worth naming to Engine rather than papering over.
