      so anonymous probes never receive an HTTP response body.
    documents:
      - {path: /.well-known/security.txt, status: null, result: no-response-mtls-required}
      - {path: /.well-known/agent-card.json, status: null, result: no-response-mtls-required}
      - {path: /openapi.json, status: null, result: no-response-mtls-required}
