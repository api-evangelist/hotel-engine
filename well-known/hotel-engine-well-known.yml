generated: '2026-08-04'
method: probed
source: live HTTPS probes of /.well-known/ and discovery paths on every Engine host
summary: >-
  Engine publishes no /.well-known/ discovery documents on any host. engine.com and
  hotelengine.com return a bespoke 404 body ("Invalid .well-known request") for every
  /.well-known/* path, confirming the path is handled and deliberately empty rather than
  merely unrouted. The one discovery document Engine does publish is a real llms.txt at
  https://engine.com/llms.txt (harvested to llms/hotel-engine-llms.txt). The API host
  partner-api.engine.com requires a client certificate (mTLS) and completes no anonymous
  HTTP request, so no /.well-known/ surface is reachable there.
hosts:
  - host: https://engine.com
    documents:
      - {path: /.well-known/security.txt, status: 404}
      - {path: /.well-known/agent-card.json, status: 404}
      - {path: /.well-known/agent.json, status: 404}
      - {path: /.well-known/openid-configuration, status: 404}
      - {path: /.well-known/oauth-authorization-server, status: 404}
      - {path: /.well-known/api-catalog, status: 404}
      - {path: /.well-known/ai-plugin.json, status: 404}
      - {path: /llms.txt, status: 200, file: ../llms/hotel-engine-llms.txt}
      - {path: /openapi.json, status: 404}
      - {path: /swagger.json, status: 404}
  - host: https://hotelengine.com
    note: legacy brand domain; redirects/serves the same Webflow site as engine.com
    documents:
      - {path: /.well-known/security.txt, status: 404}
      - {path: /.well-known/agent-card.json, status: 404}
      - {path: /.well-known/agent.json, status: 404}
      - {path: /.well-known/openid-configuration, status: 404}
      - {path: /.well-known/oauth-authorization-server, status: 404}
      - {path: /.well-known/api-catalog, status: 404}
      - {path: /.well-known/ai-plugin.json, status: 404}
      - {path: /llms.txt, status: 200}
  - host: https://omni.engine.com
    note: Omni partner marketing/intake site (Astro)
    documents:
      - {path: /.well-known/security.txt, status: 404}
      - {path: /.well-known/agent-card.json, status: 404}
      - {path: /.well-known/agent.json, status: 404}
      - {path: /.well-known/openid-configuration, status: 404}
      - {path: /.well-known/oauth-authorization-server, status: 404}
      - {path: /.well-known/api-catalog, status: 404}
      - {path: /.well-known/ai-plugin.json, status: 404}
      - {path: /llms.txt, status: 404}
      - {path: /openapi.json, status: 404}
  - host: https://engine-public.github.io
    note: Omni API documentation site (GitHub Pages, Jekyll + Swagger UI)
    documents:
      - {path: /.well-known/security.txt, status: 404}
      - {path: /.well-known/agent-card.json, status: 404}
      - {path: /.well-known/agent.json, status: 404}
      - {path: /llms.txt, status: 404}
