aid: hotel-engine
name: Engine
description: >-
  Engine (formerly Hotel Engine, rebranded in 2024) is a Denver, Colorado business travel and
  spend platform for booking and managing lodging, flights, rental cars, group travel, and
  meeting and event spaces, with travel policy enforcement, trip approvals, consolidated
  DirectBill invoicing, and the Engine X charge card. Engine says it serves 25,000+ businesses
  and 1.2 million travelers with negotiated rates across 1,000,000+ hotel properties. Its API
  product is Omni — a partner-facing lodging inventory API offered over gRPC and HTTP/JSON,
  authenticated with mutual TLS, that covers property content, real-time rate shopping,
  booking, folio generation, and cancellation. Omni is protobuf-first: the proto contracts are
  published under Apache 2.0 on GitHub and the Swagger document, descriptor set, and JVM client
  bindings are generated from them and released per version.
